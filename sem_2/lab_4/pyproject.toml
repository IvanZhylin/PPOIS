[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wedding-planner"
version = "0.2.0"
description = "Wedding planner with CLI (lab 1) and GUI MVP (lab 4)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
